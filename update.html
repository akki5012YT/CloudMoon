<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アップデート中 - CloudMoon</title>
    <style>
        /* 1. 全体のリセットと背景色の設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /* 添付画像のような暗い紺・黒系の背景色 */
            background-color: #171d26; 
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 2. 左上のロゴ配置エリア */
        .header-logo {
            position: absolute;
            top: 24px;
            left: 24px;
            width: 150px; /* ロゴの幅（必要に応じて調整してください） */
            height: 40px;  /* ロゴの高さ（必要に応じて調整してください） */
            /* ↓↓↓ 下記のURLを、ご自身のロゴ画像URLに書き換えてください ↓↓↓ */
            background-image: url("https://www.image2url.com/r2/default/images/1791936147757-e39f4b07-8e37-4e16-9363-8c9d9f2c206e.jpeg");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: left center;
        }

        /* 3. 中央のテキスト配置エリア */
        .content-box {
            text-align: center;
            padding: 20px;
        }

        /* 4. 「アップデート中」のテキストデザイン */
        .update-text {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ffffff;
            /* ほんのり文字を光らせるエフェクト（暗い背景に映えます） */
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); 
        }
        
        .sub-text {
            margin-top: 12px;
            font-size: 14px;
            color: #8fa0b5; /* 少しトーンを落としたグレー */
        }
    </style>
</head>
<body>

    <!-- 左上のロゴ（CSS側のurl部分で画像を指定してください） -->
    <div class="header-logo"></div>

    <!-- 中央のアップデート中メッセージ -->
    <div class="content-box">
        <h1 class="update-text">アップデート中</h1>
        <p class="sub-text">CloudMoonはアップデート中です。しばらくしてから再度アクセスしてください。今後のアップデートで日本語翻訳がさらに進みます</p>
    </div>

</body>
</html>
